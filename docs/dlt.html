  /* ===== 头部 ===== */
  .header { background: var(--header-grad); color: #fff; padding: 22px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.15); }

  .tag.ice { background: var(--tag-ice-bg); color: var(--text-2); }

// ====== 深色/浅色模式 ======
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem('dlt-theme', theme); } catch(_) {}
  const btn = document.getElementById('themeToggle');
  if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
  const c = getComputedStyle(document.documentElement).getPropertyValue('--text-2').trim();
  if (typeof Chart !== 'undefined') { Chart.defaults.color = c; }
}

function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('dlt-theme'); } catch(_) {}
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved || (prefersDark ? 'dark' : 'light'));
  const btn = document.getElementById('themeToggle');
  if (btn) btn.addEventListener('click', () => {
    const cur = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    applyTheme(cur);
    // 已有图表时重建，以应用新配色
    if (window.__charts && window.__charts.length) { window.__charts.forEach(c => c.destroy()); window.__charts = []; }
    document.getElementById('app').innerHTML = '<div class="loading">⏳ 正在重新渲染...</div>';
    render();
  });
}

function pad(n, len) { return String(n).padStart(len || 2, '0'); }
function heatClass(cnt) {
  if (cnt >= 6) return 'heat-5'; if (cnt >= 4) return 'heat-4';
  if (cnt >= 3) return 'heat-3'; if (cnt >= 2) return 'heat-2';
  if (cnt >= 1) return 'heat-1'; return 'heat-0';
}

async function render() {
  const data = await loadData();
  if (!data) {
    document.getElementById('app').innerHTML = '<div class="error-box">❌ 数据加载失败，请确认已运行 fetch_and_analyze.js 生成数据。<br><br>提示：若直接双击打开本文件，请改用同目录下的 <b>index_standalone.html</b>（内嵌数据版）。</div>';
    return;
  }

  document.getElementById('headerMeta').textContent =
    '📅 数据更新: ' + new Date(data.generatedAt).toLocaleString('zh-CN') + '  |  ' + data.dataRange.totalDraws + ' 期数据 (第 ' + data.dataRange.earliestIssue + ' ~ ' + data.dataRange.latestIssue + ' 期)';
  document.getElementById('headerRight').innerHTML =
    '最新开奖: <b>第 ' + data.latestDraw.code + ' 期</b><br>' + data.latestDraw.date +
    (window.INLINE_DATA ? '<br><span class="badge">内嵌数据</span>' : '<br><span class="badge">在线加载</span>');

  let html = '';

  // Row 1: 最新开奖 + 统计
  html += '<div class="row row-4">';
  html += '<div class="card"><h3>📅 最新开奖</h3><div style="text-align:center;font-weight:bold;">第 ' + data.latestDraw.code + ' 期</div><div style="text-align:center;color:var(--text-2);font-size:.85em;">' + data.latestDraw.date + '</div><div style="text-align:center;margin:12px 0;">';
  html += data.latestDraw.front.map(n => '<span class="ball front">' + pad(n) + '</span>').join('');
  html += '  ';
  html += data.latestDraw.back.map(n => '<span class="ball back">' + pad(n) + '</span>').join('');
  html += '</div></div>';

  html += '<div class="card"><h3>📊 统计摘要</h3><div class="stat-grid">';
  html += '<div class="stat-item"><div class="stat-value orange">' + data.dataRange.totalDraws + '</div><div class="stat-label">总期数</div></div>';
  html += '<div class="stat-item"><div class="stat-value blue">' + Object.values(data.frontFrequency).filter(c => c >= 4).length + '</div><div class="stat-label">🔥 前区热号 (>=4次)</div></div>';
  html += '<div class="stat-item"><div class="stat-value" style="color:var(--warm);">' + Object.values(data.backFrequency).filter(c => c >= 4).length + '</div><div class="stat-label">🔥 后区热号 (>=4次)</div></div>';
  html += '<div class="stat-item"><div class="stat-value gold">' + (data.fullCoverageRate * 100).toFixed(0) + '%</div><div class="stat-label">三区全覆盖率</div></div>';
  html += '</div></div>';

  html += '<div class="card"><h3>🔗 连号率</h3><div style="text-align:center;padding:20px;"><div style="font-size:2em;font-weight:800;color:' + (data.consecutiveRate >= 0.6 ? 'var(--hot)' : 'var(--warm)') + ';">' + (data.consecutiveRate * 100).toFixed(0) + '%</div><div style="color:var(--text-2);font-size:.85em;">近30期含连号比例</div></div></div>';

  html += '<div class="card"><h3>🔵 后区热号 Top 6</h3><div style="text-align:center;">';
  for (let i = 0; i < Math.min(6, data.backRanking.length); i++) {
    const b = data.backRanking[i];
    html += '<span class="ball back small">' + b.num + '</span><span class="tag ' + b.label.toLowerCase() + '">' + b.label + '</span><small style="color:var(--text-2);margin-right:6px;">' + b.count + '次</small>';
  }
  html += '</div></div>';
  html += '</div>';

  // Row 2: 图表
  html += '<div class="row row-3">';
  html += '<div class="card"><h3>📊 三区分布趋势 (近30期)</h3><canvas id="zoneChart"></canvas></div>';
  html += '<div class="card"><h3>🔵 后区频次图</h3><canvas id="backChart"></canvas></div>';
  html += '<div class="card"><h3>🔥 前区热号 Top 10</h3><canvas id="frontRankChart"></canvas></div>';
  html += '</div>';

  // Row 3: 推荐 + 复盘
  html += '<div class="row row-2">';
  html += '<div class="card"><h3>🎯 本期选号推荐</h3>';
  if (data.latestPrediction && data.latestPrediction.groups) {
    for (const g of data.latestPrediction.groups) {
      html += '<div class="pred-group"><h4>' + g.name + '</h4>';
      html += '<div><span style="color:var(--orange);font-weight:bold;">前区: </span>' + g.front.map(n => '<span class="ball front small">' + pad(n) + '</span>').join('') + '</div>';
      html += '<div style="margin-top:6px;"><span style="color:var(--blue);font-weight:bold;">后区: </span>' + g.back.map(n => '<span class="ball back small">' + pad(n) + '</span>').join('') + '</div>';
      html += '<div class="pred-detail">📐 ' + g.distribution + '  |  🔗 ' + ((g.consecutivePairs||[]).map(p=>pad(p[0])+'-'+pad(p[1])).join(', ')||'--') + '  |  🌡 H' + g.hotCount + '-W' + g.warmCount + '-C' + g.coldCount + '</div>';
      html += '</div>';
    }
  } else { html += '<div style="text-align:center;color:var(--text-2);padding:20px;">暂无推荐数据</div>'; }
  html += '</div>';

  html += '<div class="card"><h3>📋 上期复盘</h3>';
  if (data.review) {
    const r = data.review;
    html += '<div style="margin-bottom:8px;font-size:.85em;color:var(--text-2);">预测 ' + r.predictedForIssue + ' → 实际 ' + r.actualIssue + '</div>';
    html += '<div style="margin-bottom:10px;">' + r.actualFront.map(n => '<span class="ball front small">' + pad(n) + '</span>').join('') + '  ' + r.actualBack.map(n => '<span class="ball back small">' + pad(n) + '</span>').join('') + '</div>';
    const fpct = Math.round(r.bestFrontHits / 7 * 100);
    html += '<div class="review-bar"><span style="font-size:.8em;">前区 ' + r.bestFrontHits + '/7</span><div class="bar-bg"><div class="bar-fill ' + (fpct >= 40 ? 'good' : fpct >= 20 ? 'ok' : 'bad') + '" style="width:' + fpct + '%"></div></div><span style="font-size:.8em;font-weight:bold;">' + fpct + '%</span></div>';
    html += '<div style="margin-top:10px;">后区: <b>' + r.bestBackHits + '/3</b> 命中</div>';
  } else { html += '<div style="text-align:center;color:var(--text-2);padding:20px;">暂无复盘数据</div>'; }
  html += '</div>';
  html += '</div>';

  // Row 4: 前区热力图 + 各区详情
  html += '<div class="row row-2-1">';
  html += '<div class="card"><h3>🟠 前区频次热力图 (全 35 码)</h3>';
  html += '<div style="text-align:center;">';
  for (let n = 1; n <= 35; n++) {
    const cnt = data.frontFrequency[String(n)] || 0;
    html += '<span class="heat-cell ' + heatClass(cnt) + '" title="号码 ' + pad(n) + ' 出现 ' + cnt + ' 次">' + pad(n) + '</span>';
  }
  html += '</div></div>';

  html += '<div class="card"><h3>🗂 三区冷热详情</h3>';
  const zs = data.zoneStats || {};
  const zNames = { Z1: '一区 (01-12)', Z2: '二区 (13-24)', Z3: '三区 (25-35)' };
  for (const [k, name] of Object.entries(zNames)) {
    const z = zs[k] || {};
    html += '<div style="margin-bottom:8px;"><b style="font-size:.88em;">' + name + '</b>';
    if (z.hot && z.hot.length) html += '<div style="font-size:.8em;margin:2px 0;">🔥 热号: ' + z.hot.join(' ') + '</div>';
    if (z.warm && z.warm.length) html += '<div style="font-size:.8em;margin:2px 0;">● 温号: ' + z.warm.join(' ') + '</div>';
    if (z.cold && z.cold.length) html += '<div style="font-size:.8em;margin:2px 0;">❄ 冷号: ' + z.cold.join(' ') + '</div>';
    if (z.ice && z.ice.length) html += '<div style="font-size:.8em;margin:2px 0;">🧊 冰号: ' + z.ice.join(' ') + '</div>';
    html += '<hr style="border-color:var(--border);margin:8px 0;"></div>';
  }
  html += '</div>';
  html += '</div>';

  // Row 5: 近期开奖记录表格
  html += '<div class="card"><h3>📜 近期开奖记录 (最近 20 期)</h3><div class="table-wrap">';
  html += '<table><thead><tr>';
  html += '<th>期号</th><th>日期</th><th>前区</th><th>后区</th><th>一区</th><th>二区</th><th>三区</th><th>连号</th><th>全覆</th>';
  html += '</tr></thead><tbody id="drawTableBody"></tbody></table></div></div>';

  document.getElementById('app').innerHTML = html;
  renderDrawTable(data);
  renderCharts(data);
}

// ====== 近期开奖记录表 ======
function renderDrawTable(data) {
  const consMap = {};
  for (const c of (data.consecutiveTrend || [])) consMap[c.code] = c;

  const rowData = (data.zoneDistribution || []).slice(0, 20);
  let rows = '';
  for (const d of rowData) {
    const cons = consMap[d.code];
    const consStr = cons && cons.count > 0 ? cons.pairs.join(',') : '--';
    const fullIcon = d.full ? '✅' : '⚠️';

    const frontBalls = (d.front || []).map(n => '<span class="ball front small">' + pad(n) + '</span>').join('');
    const backBalls = (d.back || []).map(n => '<span class="ball back small">' + pad(n) + '</span>').join('');

    rows += '<tr>';
    rows += '<td><b>' + d.code + '</b></td>';
    rows += '<td style="font-size:.78em;">' + d.date + '</td>';
    rows += '<td style="white-space:nowrap;">' + (frontBalls || '--') + '</td>';
    rows += '<td style="white-space:nowrap;">' + (backBalls || '--') + '</td>';
    rows += '<td>' + d.Z1 + '</td>';
    rows += '<td>' + d.Z2 + '</td>';
    rows += '<td>' + d.Z3 + '</td>';
    rows += '<td style="font-size:.78em;">' + consStr + '</td>';
    rows += '<td>' + fullIcon + '</td>';
    rows += '</tr>';
  }

  const tbody = document.getElementById('drawTableBody');
  if (tbody) tbody.innerHTML = rows;
}

function renderCharts(data) {
  const color2 = getComputedStyle(document.documentElement).getPropertyValue('--text-2').trim();
  Chart.defaults.color = color2;
  Chart.defaults.font.family = "-apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif";
  window.__charts = window.__charts || [];

  const zoneCtx = document.getElementById('zoneChart');
  if (zoneCtx) {
    const zoneData = data.zoneDistribution.slice(0, 20).reverse();
    window.__charts.push(new Chart(zoneCtx, {
      type: 'bar',
      data: {
        labels: zoneData.map(d => d.code),
        datasets: [
          { label: '一区(01-12)', data: zoneData.map(d => d.Z1), backgroundColor: '#ea580c', borderRadius: 2 },
          { label: '二区(13-24)', data: zoneData.map(d => d.Z2), backgroundColor: '#f59e0b', borderRadius: 2 },
          { label: '三区(25-35)', data: zoneData.map(d => d.Z3), backgroundColor: '#3b82f6', borderRadius: 2 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, max: 7 } },
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, padding: 10, font: { size: 10 } } } }
      }
    }));
  }

  const backCtx = document.getElementById('backChart');
  if (backCtx) {
    const labels = [], values = [], colors = [];
    for (let n = 1; n <= 12; n++) {
      const cnt = data.backFrequency[String(n)] || 0;
      labels.push(pad(n));
      values.push(cnt);
      colors.push(cnt >= 4 ? '#ea580c' : cnt >= 2 ? '#f59e0b' : cnt >= 1 ? '#3b82f6' : 'rgba(148,163,184,.35)');
    }
    window.__charts.push(new Chart(backCtx, {
      type: 'bar',
      data: { labels, datasets: [{ data: values, backgroundColor: colors, borderRadius: 5 }] },
      options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }, plugins: { legend: { display: false } } }
    }));
  }

  const frontCtx = document.getElementById('frontRankChart');
  if (frontCtx) {
    const top10 = data.frontRanking.slice(0, 10);
    const rColors = top10.map(r => r.label === 'HOT' ? '#ef4444' : r.label === 'WARM' ? '#f59e0b' : '#3b82f6');
    window.__charts.push(new Chart(frontCtx, {
      type: 'bar',
      data: { labels: top10.map(r => r.num), datasets: [{ data: top10.map(r => r.count), backgroundColor: rColors, borderRadius: 5 }] },
      options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, scales: { x: { beginAtZero: true, ticks: { stepSize: 2 } } }, plugins: { legend: { display: false } } }
    }));
  }
}

initTheme();
render().catch(e => { document.getElementById('app').innerHTML = '<div class="error-box">❌ 渲染失败: ' + e.message + '</div>'; console.error(e); });
</script>
</body>
</html>
