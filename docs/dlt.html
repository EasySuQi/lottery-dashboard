<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🟠🔵 超级大乐透分区冷热分析仪表盘</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root { --bg: #f5f5f5; --card-bg: #ffffff; --text: #333333; --orange: #E65100; --blue: #1565C0; --gold: #D4A843; --hot: #e74c3c; --warm: #f39c12; --cold: #3498db; --ice: #95a5a6; --border: #e0e0e0; --shadow: 0 2px 8px rgba(0,0,0,0.08); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); }
  .header { background: linear-gradient(135deg, var(--orange), #bf360c); color: #fff; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .header h1 { font-size: 1.5em; }
  .header .meta { font-size: 0.85em; opacity: 0.85; }
  .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
  .row { display: grid; gap: 16px; margin-bottom: 16px; }
  .row-4 { grid-template-columns: repeat(4, 1fr); }
  .row-3 { grid-template-columns: 2fr 1fr 1fr; }
  .row-2 { grid-template-columns: 1fr 1fr; }
  .row-2-1 { grid-template-columns: 2fr 1fr; }
  @media (max-width: 1000px) { .row-4, .row-3, .row-2, .row-2-1 { grid-template-columns: 1fr; } }
  .card { background: var(--card-bg); border-radius: 8px; padding: 18px; box-shadow: var(--shadow); border: 1px solid var(--border); }
  .card h3 { font-size: 0.95em; margin-bottom: 12px; color: #555; border-bottom: 2px solid var(--orange); padding-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat-item { text-align: center; padding: 10px; background: #fafafa; border-radius: 6px; }
  .stat-value { font-size: 1.6em; font-weight: bold; }
  .stat-value.orange { color: var(--orange); }
  .stat-value.blue { color: var(--blue); }
  .stat-value.gold { color: #b8860b; }
  .stat-label { font-size: 0.8em; color: #888; margin-top: 2px; }
  .ball { display: inline-block; width: 34px; height: 34px; line-height: 34px; text-align: center; border-radius: 50%; font-weight: bold; font-size: 0.9em; margin: 2px; color: #fff; }
  .ball.front { background: var(--orange); }
  .ball.back { background: var(--blue); }
  .ball.small { width: 28px; height: 28px; line-height: 28px; font-size: 0.75em; }
  .tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 0.75em; font-weight: bold; margin-left: 3px; color: #fff; }
  .tag.hot { background: var(--hot); }
  .tag.warm { background: var(--warm); }
  .tag.cold { background: var(--cold); }
  .tag.ice { background: var(--ice); }
  .pred-group { background: #fff3e0; border: 1px solid #ffe0b2; border-radius: 6px; padding: 12px; margin-bottom: 10px; }
  .pred-group h4 { color: var(--orange); margin-bottom: 6px; font-size: 0.9em; }
  .pred-detail { font-size: 0.82em; color: #777; margin-top: 6px; }
  .review-bar { margin: 6px 0; display: flex; align-items: center; gap: 6px; }
  .review-bar .bar-bg { flex: 1; height: 18px; background: #eee; border-radius: 9px; overflow: hidden; }
  .review-bar .bar-fill { height: 100%; border-radius: 9px; transition: width 0.5s; }
  .review-bar .bar-fill.good { background: #4caf50; }
  .review-bar .bar-fill.ok { background: var(--warm); }
  .review-bar .bar-fill.bad { background: #e74c3c; }
  .heat-cell { display: inline-block; width: 34px; height: 34px; line-height: 34px; text-align: center; margin: 2px; border-radius: 4px; color: #fff; font-weight: bold; font-size: 0.78em; }
  .heat-0 { background: #e8e8e8; color: #999; }
  .heat-1 { background: #bbdefb; color: #1565c0; }
  .heat-2 { background: #64b5f6; color: #fff; }
  .heat-3 { background: #ff9800; color: #fff; }
  .heat-4 { background: #f44336; color: #fff; }
  .heat-5 { background: #b71c1c; color: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82em; }
  th { background: #f8f8f8; padding: 8px 6px; text-align: center; font-weight: 600; border-bottom: 2px solid var(--border); }
  td { padding: 6px; text-align: center; border-bottom: 1px solid #f0f0f0; }
  tr:hover td { background: #fff3e0; }
  canvas { max-height: 280px; }
  .footer { text-align: center; padding: 20px; color: #999; font-size: 0.8em; }
</style>
</head>

  // Row 4: 前区热力图 + 各区详情
  html += '<div class="row row-2-1">';
  html += '<div class="card"><h3>🟠 前区频次热力图 (全 35 码)</h3>';
  html += '<div style="text-align:center;line-height:2.2;">';
  for (const [label, low, high] of [['一区 (01-12)', 1, 12], ['二区 (13-24)', 13, 24], ['三区 (25-35)', 25, 35]]) {
    html += '<div style="margin:4px 0;font-size:0.78em;color:#888;">' + label + '</div>';
    for (let n = low; n <= high; n++) {
      const cnt = data.frontFrequency[String(n)] || 0;
      html += '<span class="heat-cell ' + heatClass(cnt) + '">' + pad(n) + '<small>(' + cnt + ')</small></span>';
    }
  }
  html += '</div></div>';

  html += '<div class="card"><h3>📍 各区冷热详情</h3>';
  for (const [zk, zs] of Object.entries(data.zoneStats)) {
    html += '<div style="margin-bottom:10px;"><b>' + zs.name + '</b></div>';
    if (zs.hot.length) html += '<div style="font-size:0.8em;margin:2px 0;">🔥 热号: ' + zs.hot.join(' ') + '</div>';
    if (zs.warm.length) html += '<div style="font-size:0.8em;margin:2px 0;">● 温号: ' + zs.warm.join(' ') + '</div>';
    if (zs.cold.length) html += '<div style="font-size:0.8em;margin:2px 0;">❄ 冷号: ' + zs.cold.join(' ') + '</div>';
    if (zs.ice.length) html += '<div style="font-size:0.8em;margin:2px 0;">🧊 冰号: ' + zs.ice.join(' ') + '</div>';
    html += '<hr style="border-color:#f0f0f0;margin:6px 0;">';
  }
  html += '</div>';
  html += '</div>';

  // Row 5: 近期开奖记录表格
  html += '<div class="card"><h3>📜 近期开奖记录 (最近 20 期)</h3><div style="overflow-x:auto;">';
  html += '<table><thead><tr>';
  html += '<th>期号</th><th>日期</th><th>前区</th><th>后区</th><th>一区</th><th>二区</th><th>三区</th><th>连号</th><th>全覆</th>';
  html += '</tr></thead><tbody id="drawTableBody"></tbody></table></div></div>';

  document.getElementById('app').innerHTML = html;
  renderDrawTable(data);
  renderCharts(data);
}

// ====== 近期开奖记录表 ======
function renderDrawTable(data) {
  const consMap = {};
  for (const c of (data.consecutiveTrend || [])) consMap[c.code] = c;

  const rowData = (data.zoneDistribution || []).slice(0, 20);
  let rows = '';
  for (const d of rowData) {
    const cons = consMap[d.code];
    const consStr = cons && cons.count > 0 ? cons.pairs.join(',') : '--';
    const fullIcon = d.full ? '✅' : '⚠️';

    const frontBalls = (d.front || []).map(n => '<span class="ball front small">' + pad(n) + '</span>').join('');
    const backBalls = (d.back || []).map(n => '<span class="ball back small">' + pad(n) + '</span>').join('');

    rows += '<tr>';
    rows += '<td><b>' + d.code + '</b></td>';
    rows += '<td style="font-size:0.78em;">' + d.date + '</td>';
    rows += '<td style="white-space:nowrap;">' + (frontBalls || '--') + '</td>';
    rows += '<td style="white-space:nowrap;">' + (backBalls || '--') + '</td>';
    rows += '<td>' + d.Z1 + '</td>';
    rows += '<td>' + d.Z2 + '</td>';
    rows += '<td>' + d.Z3 + '</td>';
    rows += '<td style="font-size:0.78em;">' + consStr + '</td>';
    rows += '<td>' + fullIcon + '</td>';
    rows += '</tr>';
  }

  const tbody = document.getElementById('drawTableBody');
  if (tbody) tbody.innerHTML = rows;
}

function renderCharts(data) {
  Chart.defaults.color = '#666';
  Chart.defaults.font.family = "-apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif";

  const zoneCtx = document.getElementById('zoneChart');
  if (zoneCtx) {
    const zoneData = data.zoneDistribution.slice(0, 20).reverse();
    new Chart(zoneCtx, {
      type: 'bar',
      data: {
        labels: zoneData.map(d => d.code),
        datasets: [
          { label: '一区(01-12)', data: zoneData.map(d => d.Z1), backgroundColor: '#E65100' },
          { label: '二区(13-24)', data: zoneData.map(d => d.Z2), backgroundColor: '#f39c12' },
          { label: '三区(25-35)', data: zoneData.map(d => d.Z3), backgroundColor: '#1565C0' }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: { x: { stacked: true }, y: { stacked: true, max: 7 } },
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, padding: 10, font: { size: 10 } } } }
      }
    });
  }

  const backCtx = document.getElementById('backChart');
  if (backCtx) {
    const labels = [], values = [], colors = [];
    for (let n = 1; n <= 12; n++) {
      const cnt = data.backFrequency[String(n)] || 0;
      labels.push(pad(n));
      values.push(cnt);
      colors.push(cnt >= 4 ? '#E65100' : cnt >= 2 ? '#f39c12' : cnt >= 1 ? '#3498db' : '#bdc3c7');
    }
    new Chart(backCtx, {
      type: 'bar',
      data: { labels, datasets: [{ data: values, backgroundColor: colors, borderRadius: 4 }] },
      options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }, plugins: { legend: { display: false } } }
    });
  }

  const frontCtx = document.getElementById('frontRankChart');
  if (frontCtx) {
    const top10 = data.frontRanking.slice(0, 10);
    const rColors = top10.map(r => r.label === 'HOT' ? '#e74c3c' : r.label === 'WARM' ? '#f39c12' : '#3498db');
    new Chart(frontCtx, {
      type: 'bar',
      data: { labels: top10.map(r => r.num), datasets: [{ data: top10.map(r => r.count), backgroundColor: rColors, borderRadius: 4 }] },
      options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, scales: { x: { beginAtZero: true, ticks: { stepSize: 2 } } }, plugins: { legend: { display: false } } }
    });
  }
}

render().catch(e => { document.getElementById('app').innerHTML = '<div style="text-align:center;padding:60px;color:#e74c3c;">❌ 渲染失败: ' + e.message + '</div>'; console.error(e); });
</script>
</body>
</html>
