  .row-4 { grid-template-columns: repeat(4, 1fr); }
  .row-3 { grid-template-columns: 2fr 1fr 1fr; }
  .row-2 { grid-template-columns: 1fr 1fr; }
  .row-2-1 { grid-template-columns: 2fr 1fr; }

  .card { background: var(--card-bg); border-radius: 8px; padding: 18px; box-shadow: var(--shadow); border: 1px solid var(--border); }
  .card h3 { font-size: 0.95em; margin-bottom: 12px; color: #555; border-bottom: 2px solid var(--red); padding-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat-item { text-align: center; padding: 10px; background: #fafafa; border-radius: 6px; }
  .stat-value { font-size: 1.6em; font-weight: bold; }
  .stat-value.red { color: var(--red); }
  .stat-value.blue { color: var(--blue); }
  .stat-value.gold { color: #b8860b; }

  .ball.red { background: var(--red); }
  .ball.blue { background: var(--blue); }
  .ball.small { width: 28px; height: 28px; line-height: 28px; font-size: 0.75em; }
  .tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 0.75em; font-weight: bold; margin-left: 3px; color: #fff; }
  .tag.hot { background: var(--hot); }
  .tag.warm { background: var(--warm); }
  .tag.cold { background: var(--cold); }
  .tag.ice { background: var(--ice); }
  .pred-group { background: #fff9f0; border: 1px solid #ffe0b2; border-radius: 6px; padding: 12px; margin-bottom: 10px; }
  .pred-group h4 { color: var(--red); margin-bottom: 6px; font-size: 0.9em; }
  .pred-detail { font-size: 0.82em; color: #777; margin-top: 6px; }
  .review-bar { margin: 6px 0; display: flex; align-items: center; gap: 6px; }
  .review-bar .bar-bg { flex: 1; height: 18px; background: #eee; border-radius: 9px; overflow: hidden; }
  .review-bar .bar-fill { height: 100%; border-radius: 9px; transition: width 0.5s; }
  .review-bar .bar-fill.good { background: #4caf50; }
  .review-bar .bar-fill.ok { background: var(--warm); }
  .review-bar .bar-fill.bad { background: var(--red); }
  table { width: 100%; border-collapse: collapse; font-size: 0.82em; }
  th { background: #f8f8f8; padding: 8px 6px; text-align: center; font-weight: 600; border-bottom: 2px solid var(--border); white-space: nowrap; }
  td { padding: 6px; text-align: center; border-bottom: 1px solid #f0f0f0; }
  tr:hover td { background: #fff9f0; }
  .footer { text-align: center; padding: 20px; color: #999; font-size: 0.8em; }
  .footer a { color: var(--red); text-decoration: none; }
  canvas { max-height: 280px; }
  .heat-cell { display: inline-block; width: 36px; height: 36px; line-height: 36px; text-align: center; margin: 2px; border-radius: 4px; color: #fff; font-weight: bold; font-size: 0.85em; }
  .heat-0 { background: #e8e8e8; color: #999; }
  .heat-1 { background: #bbdefb; color: #1565c0; }
  .heat-2 { background: #64b5f6; color: #fff; }
  .heat-3 { background: #ff9800; color: #fff; }
  .heat-4 { background: #f44336; color: #fff; }
  .heat-5 { background: #b71c1c; color: #fff; }

  html += '<div class="card">';
  html += '<h3>🔥 红球热号 Top 10</h3>';
  html += '<canvas id="redRankChart"></canvas>';
  html += '</div>';

  html += '</div>'; // end row-3

  // ========== 第三行: 推荐 + 复盘 ==========
  html += '<div class="row row-2">';

  // 本期推荐
  html += '<div class="card">';
  html += '<h3>🎯 本期选号推荐</h3>';
  if (data.latestPrediction && data.latestPrediction.groups) {
    for (const g of data.latestPrediction.groups) {
      html += '<div class="pred-group">';
      html += `<h4>${g.name}</h4>`;
      html += '<div style="margin:6px 0;">';
      html += '<span style="color:#C30D23;font-weight:bold;">红球: </span>';
      html += g.reds.map(n => `<span class="ball red small">${pad(n)}</span>`).join('');
      html += '</div>';
      html += '<div style="margin:6px 0;">';
      html += '<span style="color:#1565C0;font-weight:bold;">蓝球: </span>';
      html += g.blues.map(n => `<span class="ball blue small">${pad(n)}</span>`).join('');
      html += '</div>';
      html += `<div class="pred-detail">📐 ${g.distribution}  |  🔗 ${(g.consecutivePairs||[]).map(p=>pad(p[0])+'-'+pad(p[1])).join(', ')||'--'}  |  🌡 H${g.hotCount}-W${g.warmCount}-C${g.coldCount}</div>`;
      html += '</div>';
    }
  } else {
    html += '<div style="text-align:center;color:#999;padding:20px;">暂无推荐数据</div>';
  }
  html += '</div>';

  // 复盘对比
  html += '<div class="card">';
  html += '<h3>📋 上期复盘</h3>';
  if (data.review) {
    const r = data.review;
    html += `<div style="margin-bottom:8px;font-size:0.85em;">预测 ${r.predictedForIssue} → 实际 ${r.actualIssue}</div>`;
    html += '<div style="font-size:0.85em;margin-bottom:4px;">实际开奖:</div>';
    html += '<div style="margin-bottom:8px;">';
    html += r.actualReds.map(n => `<span class="ball red small">${pad(n)}</span>`).join('');
    html += `<span class="ball blue small">${pad(r.actualBlue)}</span>`;
    html += '</div>';
    html += '<div style="font-weight:bold;margin-bottom:8px;">红球命中率:</div>';
    const pct = Math.round(r.bestRedHits / 7 * 100);
    html += `<div class="review-bar"><span style="font-size:0.8em;">最佳 ${r.bestRedHits}/7</span>`;
    html += `<div class="bar-bg"><div class="bar-fill ${pct >= 40 ? 'good' : pct >= 20 ? 'ok' : 'bad'}" style="width:${pct}%"></div></div>`;
    html += `<span style="font-size:0.8em;font-weight:bold;color:${pct >= 40 ? '#4caf50' : pct >= 20 ? '#f39c12' : '#e74c3c'};">${pct}%</span></div>`;
    html += `<div style="font-weight:bold;margin-top:8px;">蓝球: <span style="color:${r.bestBlueHit ? '#4caf50' : '#e74c3c'};">${r.bestBlueHit ? '✅ 命中' : '❌ 未中'}</span></div>`;

    if (r.redHits) {
      for (const g of r.redHits) {
        html += `<div style="font-size:0.8em;margin-top:4px;color:#777;">${g.name}: 红 ${g.hitCount}/7${g.hits.length ? ' ('+g.hits.map(n => pad(n)).join(',')+')' : ''}</div>`;
      }
    }
  } else {
    html += '<div style="text-align:center;color:#999;padding:20px;">暂无复盘数据<br><small>首次运行或缺少对比数据</small></div>';
  }
  html += '</div>';

  html += '</div>'; // end row-2

  // ========== 第四行: 红球热力图 + 蓝球热力分布 ==========
  html += '<div class="row row-2-1">';

  // 红球频次热力图
  html += '<div class="card">';
  html += '<h3>🔴 红球频次热力图 (全 33 码)</h3>';
  html += '<div style="text-align:center;line-height:2.2;">';
  html += '<div style="margin-bottom:4px;font-size:0.78em;color:#888;">一区 (01-10)</div>';
  for (let n = 1; n <= 10; n++) {
    const cnt = data.redFrequency[String(n)] || 0;
    html += `<span class="heat-cell ${heatClass(cnt)}">${pad(n)}<small>(${cnt})</small></span>`;
  }
  html += '<div style="margin:8px 0 4px;font-size:0.78em;color:#888;">二区 (11-20)</div>';
  for (let n = 11; n <= 20; n++) {
    const cnt = data.redFrequency[String(n)] || 0;
    html += `<span class="heat-cell ${heatClass(cnt)}">${pad(n)}<small>(${cnt})</small></span>`;
  }
  html += '<div style="margin:8px 0 4px;font-size:0.78em;color:#888;">三区 (21-33)</div>';
  for (let n = 21; n <= 33; n++) {
    const cnt = data.redFrequency[String(n)] || 0;
    html += `<span class="heat-cell ${heatClass(cnt)}">${pad(n)}<small>(${cnt})</small></span>`;
  }
  html += '</div>';
  html += '<div style="text-align:center;margin-top:8px;font-size:0.75em;color:#999;">';
  html += '<span class="heat-cell heat-5">5+</span> 6+次  ';
  html += '<span class="heat-cell heat-4">4</span> 4-5次  ';
  html += '<span class="heat-cell heat-3">3</span> 3次  ';
  html += '<span class="heat-cell heat-2">2</span> 2次  ';
  html += '<span class="heat-cell heat-1">1</span> 1次  ';
  html += '<span class="heat-cell heat-0">0</span> 0次</div>';
  html += '</div>';

  // 各区分级详情
  html += '<div class="card">';
  html += '<h3>📍 各区冷热详情</h3>';
  for (const [zk, zs] of Object.entries(data.zoneStats)) {
    html += `<div style="margin-bottom:10px;"><b>${zs.name}</b></div>`;
    if (zs.hot.length) html += `<div style="font-size:0.8em;margin:2px 0;">🔥 热号: ${zs.hot.join(' ')}</div>`;
    if (zs.warm.length) html += `<div style="font-size:0.8em;margin:2px 0;">● 温号: ${zs.warm.join(' ')}</div>`;
    if (zs.cold.length) html += `<div style="font-size:0.8em;margin:2px 0;">❄ 冷号: ${zs.cold.join(' ')}</div>`;
    if (zs.ice.length) html += `<div style="font-size:0.8em;margin:2px 0;">🧊 冰号: ${zs.ice.join(' ')}</div>`;
    html += '<hr style="border-color:#f0f0f0;margin:6px 0;">';
  }
  html += '</div>';

  html += '</div>'; // end row-2-1

  // ========== 第五行: 历史开奖表格 ==========
  html += '<div class="card">';
  html += '<h3>📜 近期开奖记录 (最近 20 期)</h3>';
  html += '<div style="overflow-x:auto;">';
  html += '<table><thead><tr>';
  html += '<th>期号</th><th>日期</th><th>红球</th><th>蓝球</th><th>一区</th><th>二区</th><th>三区</th><th>连号</th><th>全覆</th>';
  html += '</tr></thead><tbody id="drawTableBody">';

  const zoneDist = data.zoneDistribution;
  const consTrend = {};
  for (const c of data.consecutiveTrend) consTrend[c.code] = c;

  html += '</tbody></table></div>';
  html += '</div>';

  document.getElementById('app').innerHTML = html;

  // ====== 渲染开奖记录表 ======
  renderDrawTable(data);

  // ====== 绘制图表 ======
  renderCharts(data);
}

// ====== 开奖记录表 ======
function renderDrawTable(data) {
  // 从 zoneDistribution 获取逐期数据（已含 reds/blue 明细，倒序）
  const rowData = data.zoneDistribution.slice(0, 20);

  // 构建连号映射
  const consMap = {};
  for (const c of data.consecutiveTrend) consMap[c.code] = c;

  let rows = '';
  for (const d of rowData) {
    const cons = consMap[d.code];
    const consStr = cons && cons.count > 0 ? cons.pairs.join(',') : '--';
    const fullIcon = d.full ? '✅' : '⚠️';

    const redBalls = (d.reds || []).map(n => `<span class="ball red small">${pad(n)}</span>`).join('');
    const blueBall = d.blue != null ? `<span class="ball blue small">${pad(d.blue)}</span>` : '--';

    rows += '<tr>';
    rows += `<td><b>${d.code}</b></td>`;
    rows += `<td style="font-size:0.78em;">${d.date}</td>`;
    rows += `<td style="white-space:nowrap;">${redBalls || '--'}</td>`;
    rows += `<td>${blueBall}</td>`;
    rows += `<td>${d.Z1}</td>`;
    rows += `<td>${d.Z2}</td>`;
    rows += `<td>${d.Z3}</td>`;
    rows += `<td style="font-size:0.78em;">${consStr}</td>`;
    rows += `<td>${fullIcon}</td>`;
    rows += '</tr>';
  }

  // 替换表格体
  const tbody = document.getElementById('drawTableBody');
  if (tbody) tbody.innerHTML = rows;
}

// ====== 图表渲染 ======
function renderCharts(data) {
  // Chart.js 全局配色
  Chart.defaults.color = '#666';
  Chart.defaults.font.family = "-apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif";

  // 三区分布堆叠柱状图
  const zoneCtx = document.getElementById('zoneChart');
  if (zoneCtx) {
    const zoneData = data.zoneDistribution.slice(0, 20).reverse();
    new Chart(zoneCtx, {
      type: 'bar',
      data: {
        labels: zoneData.map(d => d.code.slice(-3)),
        datasets: [
          { label: '一区(01-10)', data: zoneData.map(d => d.Z1), backgroundColor: '#C30D23' },
          { label: '二区(11-20)', data: zoneData.map(d => d.Z2), backgroundColor: '#f39c12' },
          { label: '三区(21-33)', data: zoneData.map(d => d.Z3), backgroundColor: '#1565C0' }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: { x: { stacked: true }, y: { stacked: true, max: 7 } },
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, padding: 10, font: { size: 10 } } } }
      }
    });
  }

  // 蓝球频次图
  const blueCtx = document.getElementById('blueChart');
  if (blueCtx) {
    const blueLabels = [], blueValues = [], blueColors = [];
    for (let n = 1; n <= 16; n++) {
      const cnt = data.blueFrequency[String(n)] || 0;
      blueLabels.push(pad(n));
      blueValues.push(cnt);
      if (cnt >= 3) blueColors.push('#C30D23');
      else if (cnt >= 2) blueColors.push('#f39c12');
      else if (cnt >= 1) blueColors.push('#3498db');
      else blueColors.push('#bdc3c7');
    }
    new Chart(blueCtx, {
      type: 'bar',
      data: { labels: blueLabels, datasets: [{ data: blueValues, backgroundColor: blueColors, borderRadius: 4 }] },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } },
        plugins: { legend: { display: false } }
      }
    });
  }

  // 红球热号排行
  const redCtx = document.getElementById('redRankChart');
  if (redCtx) {
    const top10 = data.redRanking.slice(0, 10);
    const rColors = top10.map(r => r.label === 'HOT' ? '#e74c3c' : r.label === 'WARM' ? '#f39c12' : '#3498db');
    new Chart(redCtx, {
      type: 'bar',
      data: {
        labels: top10.map(r => r.num),
        datasets: [{ data: top10.map(r => r.count), backgroundColor: rColors, borderRadius: 4 }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        scales: { x: { beginAtZero: true, ticks: { stepSize: 2 } } },
        plugins: { legend: { display: false } }
      }
    });
  }
}

// 启动
render().catch(e => { document.getElementById('app').innerHTML = `<div style="text-align:center;padding:60px;color:#e74c3c;">❌ 渲染失败: ${e.message}</div>`; console.error(e); });
</script>

</body>
</html>
